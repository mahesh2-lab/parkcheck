<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Page</title>
    <script src="auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 380px;
            padding: 40px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .blob-top {
            position: absolute;
            top: -150px;
            left: -100px;
            width: 500px;
            height: 300px;
            background: linear-gradient(90deg, #ff5bac 0%, #7d67ff 100%);
            border-radius: 50% 40% 60% 50%;
            filter: blur(2px);
            animation: blob-top-move 15s infinite alternate;
            z-index: -1;
        }
        
        .blob-bottom {
            position: absolute;
            bottom: -150px;
            right: -100px;
            width: 500px;
            height: 300px;
            background: linear-gradient(90deg, #ff5bac 0%, #7d67ff 100%);
            border-radius: 60% 50% 40% 50%;
            filter: blur(2px);
            animation: blob-bottom-move 15s infinite alternate;
            z-index: -1;
        }
        
        @keyframes blob-top-move {
            0% { transform: rotate(0deg) translate(0, 0); }
            33% { transform: rotate(5deg) translate(10px, 10px); }
            66% { transform: rotate(-5deg) translate(-10px, 5px); }
            100% { transform: rotate(0deg) translate(0, 0); }
        }
        
        @keyframes blob-bottom-move {
            0% { transform: rotate(0deg) translate(0, 0); }
            33% { transform: rotate(-5deg) translate(-10px, -10px); }
            66% { transform: rotate(5deg) translate(10px, -5px); }
            100% { transform: rotate(0deg) translate(0, 0); }
        }
        
        .small-blob {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(90deg, #ff5bac 0%, #7d67ff 100%);
            border-radius: 50%;
            filter: blur(2px);
            animation: small-blob-move 10s infinite alternate;
            z-index: -1;
        }
        
        .small-blob-1 {
            top: 100px;
            right: 80px;
        }
        
        .small-blob-2 {
            bottom: 150px;
            left: 60px;
        }
        
        @keyframes small-blob-move {
            0% { transform: translate(0, 0); }
            50% { transform: translate(20px, 10px); }
            100% { transform: translate(-10px, -15px); }
        }
        
        h1 {
            color: #7d67ff;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .input-field {
            position: relative;
            width: 100%;
        }
        
        .input-field input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-field input:focus {
            border-color: #7d67ff;
            box-shadow: 0 0 10px rgba(125, 103, 255, 0.2);
        }
        
        .btn-login {
            width: 100%;
            background: linear-gradient(90deg, #7d67ff 0%, #9b6dff 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(125, 103, 255, 0.3);
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(125, 103, 255, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(1px);
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        
        .forgot-password a {
            color: #7d67ff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .forgot-password a:hover {
            color: #ff5bac;
        }
        
        .floating-items {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
            overflow: hidden;
        }
        
        .floating-item {
            position: absolute;
            background: linear-gradient(45deg, #ff5bac, #7d67ff);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.1; }
            50% { opacity: 0.3; }
            100% { transform: translateY(-1000px) rotate(360deg); opacity: 0.1; }
        }
        
        /* Input animation */
        .input-field input::placeholder {
            color: transparent;
        }
        
        .input-field span {
            position: absolute;
            left: 15px;
            top: 15px;
            color: #999;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .input-field input:focus + span,
        .input-field input:not(:placeholder-shown) + span {
            top: -10px;
            left: 15px;
            font-size: 0.75rem;
            background: white;
            padding: 0 5px;
            color: #7d67ff;
        }
        
        /* Loading animation for button */
        @keyframes btn-loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .btn-login.loading::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff5bac 0%, #7d67ff 100%);
            border-radius: 25px;
            animation: btn-loading 2s ease-in-out;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="blob-top"></div>
    <div class="small-blob small-blob-1"></div>
    <div class="small-blob small-blob-2"></div>
    <div class="blob-bottom"></div>
    
    <div class="floating-items" id="floating-items"></div>
    
    <div class="container">
        <h1>Login</h1>
        <p class="subtitle">Sign in to Continue</p>
        
        <form action="" id="login">
            <div class="form-group">
                <div class="input-field">
                    <input type="email" id="email" placeholder="email">
                    <span>Please enter Email</span>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-field">
                    <input type="password" id="password" placeholder="password">
                    <span>Please enter Password</span>
                </div>
            </div>
            
            <button type="submit" onclick="login()" class="btn-login">LOGIN</button>
            
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
    
            <div class="signup-link" style="text-align: center; margin-top: 20px;">
                <p>Don't have an account? <a href="signUp.html">Sign Up</a></p>
            </div>
        </form>
    </div>
    
    <script>
        // Create floating background items
        const floatingItems = document.getElementById('floating-items');
        for (let i = 0; i < 20; i++) {
            const size = Math.random() * 30 + 10;
            const item = document.createElement('div');
            item.classList.add('floating-item');
            item.style.width = `${size}px`;
            item.style.height = `${size}px`;
            item.style.left = `${Math.random() * 100}%`;
            item.style.top = `${Math.random() * 100 + 100}%`;
            item.style.animationDelay = `${Math.random() * 15}s`;
            item.style.animationDuration = `${Math.random() * 10 + 15}s`;
            floatingItems.appendChild(item);
        }
        
        // Button animation
      
        
        // Input field focus effects
        const inputs = document.querySelectorAll('.input-field input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentNode.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentNode.classList.remove('focused');
            });
        });
    </script>
</body>
</html>
